name: Publish releases

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.vscode/**'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-core:
    name: Core Packages CI
    uses: ./.github/workflows/ci.yml
    permissions:
      actions: read
      contents: read

  release:
    name: Release
    # Must be a GitHub-hosted runner: npm provenance (publishConfig.provenance
    # in each package) is rejected with E422 on self-hosted runners like
    # Blacksmith. Only "github-hosted" runners can publish with provenance.
    runs-on: ubuntu-latest
    needs: ci-core
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # npm CLI >= 11.5.1 and Node >= 22.14 are required for OIDC trusted
      # publishing. changeset publish shells out to `npm publish`, so the
      # `npm` on PATH must be recent enough.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Node 24 already bundles npm >= 11.5.1 (OIDC-capable). Pin to the npm 11
      # line rather than npm@latest, which is now npm@12 and requires a newer
      # node minor than setup-node provides (EBADENGINE).
      - name: Ensure npm is trusted-publishing-capable (>= 11.5.1)
        run: npm install -g npm@11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all packages
        run: bun run build

      # No npm auth step: authentication is handled via GitHub OIDC (trusted
      # publishing). changesets/action auto-detects OIDC when NPM_TOKEN is
      # absent and the id-token env vars are present. Each package must have a
      # trusted publisher configured on npmjs.com pointing at this repo +
      # publish.yml — see docs/PUBLISHING.md.
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1.9.0
        with:
          publish: bun run release
          version: bun run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: bun run publish:github

  docs:
    name: Generate Documentation
    needs: release
    if: needs.release.result == 'success'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Generate documentation
        run: echo "Documentation generation not yet configured"
