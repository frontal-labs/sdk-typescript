name: CI

on:
  pull_request:
    paths-ignore:
      - 'LICENSE'
      - '**/.prettierrc'
      - '**/.prettierignore'
      - '**/.editorconfig'
      - '.vscode/**'
      - '**/.gitignore'
      - '**/.gitattributes'
  workflow_call:

permissions:
  actions: read
  contents: read

jobs:
  ci:
    name: Build, format, lint, type-check, and test
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Build all packages
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run type-check

      # Coverage thresholds (80% global, vitest.config.ts) are enforced here.
      - name: Run tests (with coverage gate)
        run: bun run test:coverage
        timeout-minutes: 20

      # Docs-as-tests: every ```ts block in README.md, packages/*/README.md and
      # examples/SDKS_GUIDE.md must type-check, and the sdk quickstart must run
      # against mocks. A stale example is a red build.
      - name: README examples
        run: bun run test:examples

      # llms.txt / llms-full.txt / docs/mcp.json are generated from the READMEs;
      # fail if they were not regenerated (`bun run docs:manifest`).
      - name: Docs freshness (llms.txt)
        run: bun run docs:manifest:check

      # Contract gate: fails the build on endpoint-snapshot drift, forbidden
      # cross-surface calls, or any regression below the committed API coverage
      # floor (contracts/coverage-floor.json). This is the migration-validation +
      # coverage-enforcement gate — coverage can only rise, never silently drop.
      - name: Contract & coverage gate
        run: bun run contract:endpoints

      # Regenerate the migration matrix and fail if it is not up to date, so the
      # committed matrix always reflects real SDK↔spec coverage.
      - name: Migration matrix up to date
        run: |
          bun run contract:matrix
          git diff --exit-code contracts/reports/migration-matrix.md

