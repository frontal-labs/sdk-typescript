name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/docs/**'
      - 'LICENSE'
      - '**/.prettierrc'
      - '**/.prettierignore'
      - '**/.editorconfig'
      - '.vscode/**'
      - '**/.gitignore'
      - '**/.gitattributes'
  workflow_call:

permissions:
  actions: read
  contents: read

jobs:
  ci:
    name: Build, format, lint, type-check, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Build all packages
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run type-check

      - name: Run tests
        run: bun run test
        timeout-minutes: 15

      - name: Run Snyk security scan
        uses: snyk/actions/node@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
