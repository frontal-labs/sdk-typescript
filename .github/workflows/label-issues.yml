name: Label Issues and PRs

on:
  issues:
    types: [opened, transferred]
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/labeler@v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
