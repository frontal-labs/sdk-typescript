name: Core packages tests
# Reusable workflow - called by ci.yml (PRs) and publish.yml (main)

on:
  workflow_call:

permissions:
  actions: read
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf \
            "git@github.com:"
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf \
            "ssh://git@github.com/"
          bun install --frozen-lockfile

      - name: Check code formatting
        run: bun run format:check

      - name: Type check
        run: bun run type-check

      - name: Build all packages
        run: bun run build

      - name: Run tests
        run: bun run test
        timeout-minutes: 15
