name: Core packages tests
# Reusable workflow — called by ci.yml (PRs) and publish.yml (main)

on:
  workflow_call:

permissions:
  actions: read
  contents: read

jobs:
  build-test:
    name: Build, type-check, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all packages
        run: bun run build

      - name: Type check
        run: bun run type-check

      - name: Run tests
        run: bun run test
        timeout-minutes: 15

      - name: Run Snyk security scan
        uses: snyk/actions/node@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
