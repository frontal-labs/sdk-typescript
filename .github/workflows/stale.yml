name: Stale Issue and PR Management

on:
  schedule:
    - cron: "37 8 * * 1"
  workflow_dispatch:

jobs:
  stale:
    name: Mark and close stale items
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/stale@v10
        with:
          stale-issue-message: >
            This issue has been marked as stale due to 60 days of inactivity.
            It will be closed in 30 days if no further activity occurs.
          stale-pr-message: >
            This PR has been marked as stale due to 60 days of inactivity.
            It will be closed in 30 days if no further activity occurs.
          days-before-issue-stale: 60
          days-before-issue-close: 30
          days-before-pr-stale: 60
          days-before-pr-close: 30
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,security,roadmap,keep"
          exempt-pr-labels: "pinned,security,roadmap,keep"
          operations-per-run: 100
          remove-stale-when-updated: true
