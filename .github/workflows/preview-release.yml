name: Preview release

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.base.json'
      - 'turbo.json'
      - '.github/workflows/preview-release.yml'

jobs:
  preview:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all packages
        run: bun run build

      - name: Publish preview packages
        run: |
          npx pkg-pr-new@latest publish --compact \
            ./packages/agents \
            ./packages/ai \
            ./packages/blob \
            ./packages/core \
            ./packages/functions \
            ./packages/graph \
            ./packages/ontology \
            ./packages/pipelines \
            ./packages/testing \
            ./packages/workflows || \
            echo "Preview publish skipped (pkg-pr-new app not installed)"
